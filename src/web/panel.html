<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stagepass · 终端面板</title>
<link rel="stylesheet" href="/xterm.css">
<style>
/*
 * Abstract Cloud & Sea Motion —— 沿用 2026-07-24 已确认的视觉方向。
 * 色板、字标、玻璃表面与圆形阶段轨道都照原样，新增的只有轨道里那块终端。
 */
:root {
  color-scheme: dark;

  --background: oklch(0.175 0.035 295);
  --foreground: oklch(0.94 0.022 74);
  --primary: oklch(0.79 0.085 73);
  --primary-foreground: oklch(0.205 0.035 295);
  --muted-foreground: oklch(0.79 0.025 75 / 72%);
  --border: oklch(0.89 0.025 75 / 17%);
  --success: oklch(0.66 0.065 145);
  --blocked: oklch(0.64 0.115 31);

  --stagepass-sand: oklch(0.79 0.085 73);
  --stagepass-rose: oklch(0.64 0.085 25);
  --stagepass-sea: oklch(0.47 0.065 250);
  --stagepass-mist: oklch(0.9 0.025 74);
  --stagepass-panel: oklch(0.205 0.04 295 / 80%);

  --radius: 0.75rem;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  color-scheme: dark;
}

body {
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  background: var(--background);
  color: var(--foreground);
  font: 14px/1.6 ui-sans-serif, -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  overflow: hidden;
}

/* 云海本体是一张真实生成的栅格资产，不用 CSS 伪造。 */
body::before,
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; }

body::before {
  z-index: -2;
  background-image: url("/assets/abstract-cloud-sea.png");
  background-position: center;
  background-size: cover;
  filter: saturate(0.7) brightness(0.48) contrast(0.96);
  transform: scale(1.045);
  animation: breathe 18s ease-in-out infinite alternate;
}

body::after {
  z-index: -1;
  background:
    linear-gradient(180deg,
      oklch(0.12 0.035 300 / 72%) 0%,
      oklch(0.17 0.035 295 / 38%) 34%,
      oklch(0.18 0.04 292 / 56%) 64%,
      oklch(0.115 0.035 285 / 80%) 100%),
    radial-gradient(circle at 50% 43%, oklch(0.83 0.04 70 / 11%), transparent 38%);
}

@keyframes breathe {
  from { transform: scale(1.045) translate3d(0, 0, 0); }
  to   { transform: scale(1.075) translate3d(0, -1.2%, 0); }
}

@media (prefers-reduced-motion: reduce) {
  body::before { animation: none; }
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ── 顶栏：轻量，细分隔线，轻微模糊 ────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  min-height: 64px; padding: 0 28px;
  border-bottom: 1px solid var(--border);
  background: oklch(0.16 0.035 295 / 72%);
  backdrop-filter: blur(20px);
}

.wordmark {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 18px; text-transform: lowercase; letter-spacing: 0.18em;
  color: var(--foreground);
}

.crumb { color: var(--muted-foreground); font-size: 13px; letter-spacing: .04em; }
.crumb b { color: var(--foreground); font-weight: 500; }

.local-state {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--muted-foreground);
}
.local-state::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--success); box-shadow: 0 0 12px oklch(0.66 0.065 145 / 70%);
}

.kicker {
  font-size: .68rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: .2em; color: oklch(0.79 0.085 73 / 90%);
}

/* ── 舞台 ──────────────────────────────────────────────── */
main { flex: 1; min-height: 0; position: relative; }

.view { position: absolute; inset: 0; transition: opacity .34s ease-out, transform .34s ease-out; }
/* !important because the per-view display rules below are ID selectors, and an
   ID beats a class -- without this, `hidden` silently does nothing and both
   views stack on top of each other. */
.view[hidden] { display: none !important; }
.view.leaving { opacity: 0; transform: scale(.965); }
.view.entering { opacity: 0; transform: scale(1.03); }

/* ── 圆形阶段轨道 ──────────────────────────────────────── */
#orbit-view { display: grid; place-items: center; padding: 24px; }

.orbit {
  position: relative;
  /* 节点靠三角函数定位，外轨与中心信息共享同一个坐标系。 */
  width: min(72vh, 68vw); aspect-ratio: 1;
}

.orbit-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1px solid oklch(0.89 0.025 75 / 14%);
  box-shadow:
    inset 0 0 90px oklch(0.79 0.085 73 / 7%),
    0 24px 90px oklch(0.08 0.03 290 / 26%);
}

.orbit-ring::after {
  content: ""; position: absolute; inset: -1px; border-radius: 50%;
  background: conic-gradient(from 0deg,
    transparent 0deg, oklch(0.79 0.085 73 / 16%) 26deg, transparent 62deg,
    transparent 180deg, oklch(0.47 0.065 250 / 14%) 208deg, transparent 246deg);
  animation: sweep 26s linear infinite;
}
@keyframes sweep { to { transform: rotate(360deg); } }

.node {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 6px 10px; border: 0; background: none; cursor: pointer;
  color: var(--muted-foreground); font: inherit; font-size: 12px;
  letter-spacing: .04em; white-space: nowrap;
  transition: transform .22s ease-out, color .22s ease-out;
  /* 放大只作用在自己身上，不推动别的节点，也不改变圆环布局。 */
  transform-origin: center;
}
.node .dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: oklch(0.89 0.025 75 / 22%);
  transition: background .22s ease-out, box-shadow .22s ease-out;
}
.node:hover, .node:focus-visible { color: var(--foreground); outline: none; }
.node:hover { transform: translate(-50%, -50%) scale(1.3); }
.node:focus-visible { transform: translate(-50%, -50%) scale(1.3); }

.node.bound { color: oklch(0.9 0.025 74 / 88%); }
.node.bound .dot {
  background: var(--stagepass-sand);
  box-shadow: 0 0 14px oklch(0.79 0.085 73 / 55%);
}
.node.live .dot {
  background: var(--success);
  box-shadow: 0 0 16px oklch(0.66 0.065 145 / 70%);
  animation: pulse 2.6s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .55; } }

.orbit-center {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 58%; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.orbit-center h1 {
  margin: 0; font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(20px, 3.4vh, 30px); font-weight: 400; letter-spacing: .04em;
  color: var(--foreground);
}
.orbit-center p { margin: 0; font-size: 13px; color: var(--muted-foreground); }
.orbit-center .hint { font-size: 12px; color: oklch(0.79 0.025 75 / 54%); }

/* ── 阶段视图（那块终端） ──────────────────────────────── */
#stage-view { display: flex; flex-direction: column; padding: 18px 24px 24px; gap: 12px; }

.stage-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.stage-title {
  display: flex; align-items: baseline; gap: 12px;
  font-family: Georgia, "Times New Roman", serif; font-size: 20px; letter-spacing: .04em;
  color: var(--foreground);
  /* 标题落在云海最亮的一段上，没有这层阴影会糊进背景里。 */
  text-shadow: 0 1px 12px oklch(0.1 0.03 290 / 85%);
}
.stage-title .thread { font: 11px/1 ui-monospace, Menlo, monospace; color: oklch(0.79 0.025 75 / 52%); }

.back {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: oklch(0.22 0.035 295 / 54%); backdrop-filter: blur(12px);
  color: var(--foreground); font: inherit; font-size: 13px;
  padding: 7px 14px; cursor: pointer; transition: background .2s ease-out;
}
.back:hover { background: oklch(0.3 0.045 292 / 72%); }

/*
 * 半透明深灰紫表面，不是又一层嵌套卡片。
 *
 * 比别处更深更实，是有原因的：终端里的字是 Codex 自己用暗灰画的，
 * 80% 那档透明度压在明亮的云海上，对比度直接塌掉，字看不清。
 * 材质（模糊、描边、阴影）不变，只把这一块压深 —— 设计稿 §4.5 的
 * 决策区本来也是"一层半透明深色表面"。
 */
.surface {
  flex: 1; min-height: 0; position: relative;
  border: 1px solid oklch(0.89 0.025 75 / 12%);
  border-radius: var(--radius);
  background: oklch(0.132 0.028 295);
  box-shadow: 0 22px 80px oklch(0.08 0.03 290 / 38%);
  padding: 12px 14px;
}
#term { width: 100%; height: 100%; }
.xterm .xterm-viewport { background: transparent !important; }

.note {
  font-size: 12px; color: oklch(0.86 0.025 75 / 62%);
  text-shadow: 0 1px 10px oklch(0.1 0.03 290 / 80%);
}
</style>
</head>
<body>
<header class="topbar">
  <span class="wordmark">stagepass</span>
  <span class="crumb">Change <b id="crumb-change">—</b></span>
  <span class="local-state" id="local-state">本地</span>
</header>

<main>
  <section class="view" id="orbit-view">
    <div class="orbit" id="orbit">
      <div class="orbit-ring"></div>
      <div class="orbit-center">
        <span class="kicker">Stage Orbit</span>
        <h1 id="center-title">选择一个阶段</h1>
        <p id="center-line">十一个阶段，每个阶段一个 Codex 线程。</p>
        <p class="hint">点开一个节点，Codex 就在那个阶段的线程里打开。</p>
      </div>
    </div>
  </section>

  <section class="view" id="stage-view" hidden>
    <div class="stage-head">
      <div class="stage-title">
        <span id="stage-name">—</span>
        <span class="thread" id="stage-thread"></span>
      </div>
      <button class="back" id="back">← 返回阶段环</button>
    </div>
    <div class="surface"><div id="term"></div></div>
    <p class="note">画面由 Codex 自己绘制。这里不做任何裁决：选择仍然发生在 Codex 的选择器里。</p>
  </section>
</main>

<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script src="/panel.js"></script>
</body>
</html>
