<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stagepass · 终端面板</title>
<link rel="stylesheet" href="/xterm.css">
<style>
/*
 * Abstract Cloud & Sea Motion + 三列 2:2:6 + Circular Stage Orbit。
 * 版式照 2026-07-24 的方向与 01-stage-orbit.png，只有第三列里那块终端是新的。
 *
 * 三件不许"简化"的事：
 *   1. 老式衬线 + 负字距（Iowan Old Style / Palatino）；
 *   2. 节点是细描边的圆，标签在圆外面；
 *   3. 大环上有一道扫光，进程活着的节点呼吸。
 *
 * 2026-07-29 用户定的四条（交接 §5.0），改这个文件前先读：
 *   1. 主屏只留一个大环 —— 同心的第二圈（原来的 .halo::after 虚线）已经去掉，
 *      **小环即 .stage-node 的圆一律不动**；
 *   2. 阶段 pass / fail 用颜色区分，绿 = 人批准过，黄 = 有问题；
 *   3. 点小环弹窗，显示这个阶段现在的问题；
 *   4. 不要污染 UI —— **新东西默认不进主屏**。缺信息的答案是左侧面板或弹窗，
 *      不是往环那屏塞。方向是减，不是加。
 */
:root {
  color-scheme: dark;
  --background: oklch(0.175 0.035 295);
  --foreground: oklch(0.94 0.022 74);
  --border: oklch(0.89 0.025 75 / 17%);
  --success: oklch(0.66 0.065 145);

  --sand: #e1c9a8;
  --sand-strong: #e4cfad;
  --sand-deep: #d9b28e;
  --rose: #a97879;

  /*
   * 阶段的 pass / fail。低饱和的灰绿与暖沙金 —— 设计稿 §3 明确禁止高饱和警示色，
   * 所以这里不用 #22c55e / #f59e0b 那种仪表盘配色。
   *
   * 同一段设计稿还写着"不依赖颜色作为唯一状态表达"，所以每处用到这两个色的地方
   * 都另有一个非颜色信号：环上是形状（对勾 / 空心圈 / 实心点），左面板和弹窗里
   * 是文案。改配色时这条一起改，别只换 hex。
   */
  --approved: oklch(0.74 0.055 152);
  --problem: oklch(0.80 0.082 76);

  --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, "Songti SC", serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

body {
  position: relative; isolation: isolate;
  display: flex; flex-direction: column;
  background: var(--background); color: var(--foreground);
  font: 14px/1.6 ui-sans-serif, -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  overflow: hidden;
}

body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; }
body::before {
  z-index: -2;
  background: url("/assets/abstract-cloud-sea.png") center / cover;
  filter: saturate(0.7) brightness(0.48) contrast(0.96);
  transform: scale(1.045);
  animation: breathe 18s ease-in-out infinite alternate;
}
body::after {
  z-index: -1;
  background:
    linear-gradient(180deg, oklch(0.12 0.035 300 / 74%) 0%, oklch(0.17 0.035 295 / 40%) 34%,
      oklch(0.18 0.04 292 / 58%) 64%, oklch(0.115 0.035 285 / 82%) 100%),
    radial-gradient(circle at 62% 44%, oklch(0.83 0.04 70 / 10%), transparent 40%);
}
@keyframes breathe {
  from { transform: scale(1.045) translate3d(0,0,0); }
  to   { transform: scale(1.075) translate3d(0,-1.2%,0); }
}

/* ── 顶栏 ─────────────────────────────────────────────── */
.topbar {
  display: grid; grid-template-columns: 260px 1fr 260px; align-items: center;
  min-height: 66px; padding: 0 28px; flex: 0 0 auto;
  border-bottom: 1px solid var(--border);
  background: oklch(0.16 0.035 295 / 72%); backdrop-filter: blur(20px);
}
.wordmark {
  font: 650 24px/1 var(--serif); text-transform: lowercase; letter-spacing: .17em;
}
.crumb {
  text-align: center; color: rgba(255,255,255,.5);
  font: 500 11px/1 ui-monospace, monospace; letter-spacing: .1em;
}
.crumb b { color: rgba(255,255,255,.88); font-weight: 700; }
.live-flag {
  text-align: right; color: rgba(255,255,255,.55);
  font: 600 10px/1 ui-sans-serif, sans-serif; letter-spacing: .1em;
}
.live-flag i {
  display: inline-block; width: 7px; height: 7px; margin-right: 7px;
  border-radius: 50%; background: var(--success);
  box-shadow: 0 0 12px oklch(0.66 0.065 145 / 70%); animation: pulse 2.6s infinite;
}
@keyframes pulse { 50% { opacity: 1; transform: scale(1.2); } }

/*
 * ── 三列 2 : 2 : 6，可以整体收起 ──────────────────────
 *
 * 点左侧的 Project 展开成完整三列；再点一下收起，只剩这个 Change 的阶段环
 * 铺满整屏。收起靠把前两列的宽度动画到 0，而不是 display:none —— 后者会瞬间
 * 消失，环也会跳一下尺寸；宽度过渡则让环平滑地长过去。
 */
.columns {
  position: relative; /* the expand pill is positioned against this */
  flex: 1; min-height: 0; display: grid;
  grid-template-columns: 2fr 2fr 6fr;
  transition: grid-template-columns .52s cubic-bezier(.22,.8,.28,1);
}
.columns.collapsed { grid-template-columns: 0fr 0fr 10fr; }
.columns.collapsed .col.workspace { border-left-color: transparent; }
.col { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.col + .col { border-left: 1px solid oklch(0.89 0.025 75 / 11%); }

/* 收起时列内容不许溢出，否则会从环底下透出来 */
.col.workspace { overflow: hidden; }
.columns.collapsed .col.workspace > * { opacity: 0; transition: opacity .2s ease; }

/* 收起后回到三列的入口。收起时才出现。 */
.expand {
  position: absolute; left: 18px; top: 18px; z-index: 20;
  display: none; align-items: center; gap: 9px;
  padding: 9px 15px; border: 1px solid var(--border); border-radius: 999px;
  background: oklch(0.2 0.038 295 / 72%); backdrop-filter: blur(16px);
  color: rgba(255,255,255,.72); cursor: pointer;
  font: 700 10px/1 ui-sans-serif, sans-serif; letter-spacing: .12em; text-transform: uppercase;
  transition: background .2s, color .2s;
}
.expand:hover { background: oklch(0.28 0.045 292 / 82%); color: #fff; }
.columns.collapsed .expand { display: inline-flex; }

/* 只用细分隔线和轻微背景层次，不用互相嵌套的卡片。 */
.col.workspace { background: oklch(0.17 0.038 295 / 62%); overflow-y: auto; }
.col.workspace + .col.workspace { background: oklch(0.195 0.04 295 / 52%); }

/* flex-wrap is load-bearing: without it the 100%-wide kicker squeezes the
   heading to zero width and you get a single clipped letter. */
.col-head { padding: 22px 22px 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
.col-head small {
  font: 850 9px/1 ui-sans-serif, sans-serif; letter-spacing: .2em;
  text-transform: uppercase; color: oklch(0.79 0.085 73 / 88%);
  flex: 0 0 100%; margin-bottom: 8px;
}
.col-head h2 { margin: 0; font: 560 22px/1 var(--serif); letter-spacing: -.03em; }
.col-head .count {
  margin-left: auto; font: 500 11px/1 ui-monospace, monospace; color: rgba(255,255,255,.42);
}

/*
 * 新建。**这不是业务决策入口** —— 开一个新活不推动任何闸门，也不对任何产物下
 * 判断（PRD §1.1）。所以它可以在网页上，而 approve / reject 永远不可以。
 *
 * 做得很轻：一个 + 号，不是一块常驻的表单。主屏的规矩是「新东西默认不进主屏」，
 * 这两列也照办。
 */
.col-head .new {
  width: 22px; height: 22px; padding: 0; margin-left: 2px;
  border: 1px solid rgba(255,255,255,.18); border-radius: 7px;
  background: transparent; color: rgba(255,255,255,.5); cursor: pointer;
  font: 500 13px/1 ui-sans-serif, sans-serif;
  transition: background .2s, color .2s, border-color .2s;
}
.col-head .new:hover {
  background: rgba(255,255,255,.09); color: #fff; border-color: rgba(255,255,255,.34);
}

.rows { padding: 0 12px 18px; display: flex; flex-direction: column; gap: 3px; }
.row {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 13px 14px; border: 1px solid transparent; border-radius: 11px;
  background: transparent; color: rgba(255,255,255,.72); font: inherit;
  transition: background .2s, border-color .2s, color .2s;
}
.row:hover { background: rgba(255,255,255,.05); color: #fff; }
.row[aria-selected="true"] {
  border-color: rgba(225,198,160,.5); background: rgba(169,113,103,.16); color: #fff;
}
.row strong { display: block; font: 500 15px/1.35 var(--serif); letter-spacing: -.01em; }
.row span {
  display: block; margin-top: 5px;
  font: 500 10px/1 ui-monospace, monospace; letter-spacing: .07em;
  color: rgba(255,255,255,.42); text-transform: uppercase;
}
.row .muted { color: rgba(255,255,255,.34); font-size: 11px; margin-top: 6px; display: block; }

/* ── 第三列 ───────────────────────────────────────────── */
.col.stage { position: relative; }
.view { position: absolute; inset: 0; }
.view[hidden] { display: none !important; }

/*
 * ── 第三列内部再分 40 / 60（用户 2026-07-29 定）────────────
 *
 * 左 40% 是常驻的阶段状态面板，右 60% 只放环。**Projects / Changes 两列不动**，
 * 整页仍然是 2 : 2 : 6 —— 切的是第三列自己。
 *
 * 代价是环的容器从整列缩到 60%，**所以环必须同时放大**，否则就把他先前抱怨过的
 * "环太小、比例不协调"原样做回来一遍。腾空间的办法是减：原来顶上的 .gate-head
 * （Change 标题那块）并进了左面板，底下那条决策区整条撤掉了，第三列右半边现在
 * 除了环什么都没有，环因此可以吃满可用高度。
 */
#orbit-view {
  display: grid; grid-template-columns: 40% 60%; align-items: stretch;
  transition: opacity .35s ease, transform .65s cubic-bezier(.22,.8,.28,1);
}
#orbit-view.entering { opacity: 0; transform: scale(1.16); }

/*
 * 左 40%：阶段状态常驻面板，悬停驱动。
 *
 * 鼠标移到某个阶段的小环上，这里刷成那个阶段的状态；离开所有节点就回到 Change
 * 概览。它不是"新增的一块内容"—— 它是原来压在环底下那条决策区（风险 chip +
 * 闸门结论 + 两个按钮）的去处。主屏减掉的东西落在这里和弹窗里，这正是
 * "不要污染 UI"要的方向。
 */
.status-panel {
  display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  padding: 30px 26px 24px 30px;
  border-right: 1px solid oklch(0.89 0.025 75 / 9%);
  transition: padding-top .52s cubic-bezier(.22,.8,.28,1);
}
/*
 * 收起工作区之后，前两列宽度归零，「☰ 展开工作区」那颗药丸（.expand，绝对定位在
 * .columns 左上角）正好压在这块面板的 kicker 上。给它让开一行。
 */
.columns.collapsed .status-panel { padding-top: 72px; }
.status-kicker {
  display: block; min-height: 11px;
  font: 850 9px/1.2 ui-sans-serif, sans-serif; letter-spacing: .2em;
  text-transform: uppercase; color: oklch(0.79 0.085 73 / 88%);
}
/*
 * 两行的高度先占住。标题在 Change 名（可能三行）和阶段名（一行）之间来回换，
 * 不占位的话下面整块会随着鼠标上下跳。
 */
.status-title {
  margin: 14px 0 0; min-height: 2.24em;
  font: 560 clamp(21px, 1.95vw, 28px)/1.12 var(--serif);
  letter-spacing: -.045em; overflow-wrap: anywhere;
}
.status-line {
  margin: 12px 0 0; color: rgba(255,255,255,.56); font-size: 12.5px; line-height: 1.75;
}
.status-facts { margin: 20px 0 0; }
.status-facts > div {
  display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
  padding: 9px 0; border-top: 1px solid rgba(255,255,255,.085);
}
.status-facts dt {
  flex: 0 0 auto;
  font: 700 9px/1.4 ui-sans-serif, sans-serif; letter-spacing: .12em;
  text-transform: uppercase; color: rgba(255,255,255,.4);
}
.status-facts dd {
  margin: 0; min-width: 0; text-align: right;
  font: 500 12px/1.5 ui-sans-serif, sans-serif; color: rgba(255,255,255,.84);
  overflow: hidden; text-overflow: ellipsis;
}
.status-foot {
  margin-top: auto; padding-top: 18px;
  font: 400 11px/1.65 var(--serif); color: rgba(255,255,255,.4);
}

/*
 * 状态本身，写成字而不是只靠颜色。
 *
 * 设计稿 §3 要求"不依赖颜色作为唯一状态表达"—— 环上的第二信号是形状（对勾 /
 * 空心圈 / 实心点），这里的第二信号是文案。
 */
.mark-pill {
  /* align-self: a flex item in the status column would otherwise stretch the
     pill across the whole 40%, which reads as a banner rather than a tag. */
  display: inline-flex; align-self: flex-start; align-items: center; gap: 7px;
  margin-top: 14px; padding: 5px 11px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05);
  font: 750 9px/1 ui-sans-serif, sans-serif; letter-spacing: .13em;
  text-transform: uppercase; color: rgba(255,255,255,.6);
}
.mark-pill::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%;
  background: currentColor; opacity: .85;
}
.mark-pill.approved {
  color: var(--approved);
  border-color: color-mix(in oklch, var(--approved) 42%, transparent);
  background: color-mix(in oklch, var(--approved) 11%, transparent);
}
.mark-pill.problem {
  color: var(--problem);
  border-color: color-mix(in oklch, var(--problem) 46%, transparent);
  background: color-mix(in oklch, var(--problem) 11%, transparent);
}
/* The class sets `display`, so it beats the UA rule for [hidden] on its own. */
.mark-pill[hidden] { display: none; }

/*
 * 右 60%：只有环。
 *
 * 环取"容器里放得下的最大正方形"。用 container query 单位取 min(宽, 高) 而不是
 * 百分比：只按宽度定尺寸的话，窗口一矮环就被切掉；只按高度定，第三列一窄环就横
 * 着溢出。底部那圈 padding 是给节点标签的 —— 标签画在圆外面，不算进直径里。
 */
.orbit-stage {
  container-type: size;
  position: relative; min-width: 0; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  /*
   * 左右只留 14px。**别把它调回舒服的 24px** —— 正方形是被宽度卡死的（60% 的列
   * 里，宽 432 而高 604，垂直方向白白空着 170px），所以水平方向每一像素留白都直接
   * 从环的直径里扣。上下反而随便给，那边有的是。
   */
  padding: 16px 14px 34px;
}

/*
 * 环吃满 .orbit-stage 放得下的最大正方形。
 *
 * 老版本是 `height:100%` 加 `max-width:78%`，那是给"上面还压着标题、下面还压着
 * 决策区"的版式配的。现在右半边只有环，再留 22% 的余量就是白白把环做小 ——
 * 而环变小恰恰是用户先前抱怨过的事，切成 60% 之后不许再犯。
 */
.orbit-wrap {
  position: relative; flex: 0 0 auto;
  width: min(100cqw, 100cqh); aspect-ratio: 1;
}

/*
 * 一条轨道，不是两条。
 *
 * 原来这里还有一圈 `.halo::after` —— 同心的内层虚线，反向慢转。用户 2026-07-29
 * 明确要求主屏"只要一个大环"，去掉的就是它。`::before` 留着：那是画在**同一条**
 * 轨道上的扫光，不是第二个圆。
 *
 * 想加回一圈同心装饰之前先重读交接 §5.0.1：方向是减，不是加。
 */
.halo, .halo::before { position: absolute; border-radius: 50%; pointer-events: none; }
/*
 * inset 决定轨道半径 = (1 - 2×inset) / 2 × 环宽 = 0.455 × 环宽。
 *
 * **这个 0.455 必须和 panel.js 里 placeNodes 的系数一样**，节点就骑在轨道上；
 * 两边任何一个单独改，节点就会浮在轨道内外。原来两边都是 0.43（inset 7%），
 * 切成 60% 的列之后一起外推，把环在剩下的宽度里做到最大。
 */
.halo {
  inset: 4.5%; border: 1px solid rgba(255,255,255,.19);
  box-shadow: inset 0 0 54px rgba(225,195,166,.07);
}
.halo::before {
  content: ""; inset: -6px;
  background: conic-gradient(from 0deg, transparent 0 14%, rgba(226,200,164,.45) 19%,
    transparent 25% 63%, rgba(143,132,163,.4) 69%, transparent 75%);
  -webkit-mask: radial-gradient(transparent 68%, #000 69% 71%, transparent 72%);
  mask: radial-gradient(transparent 68%, #000 69% 71%, transparent 72%);
  animation: ringSweep 12s linear infinite;
}
@keyframes ringSweep { to { transform: rotate(360deg); } }

/*
 * 进度圆弧：绕着轨道的那道沙金弧线，标已经走到哪（设计稿要的东西之一）。
 *
 * 从十二点开始顺时针，长度由 `--progress`（0–1）给 —— 和节点的摆法同一个起点、
 * 同一个方向，所以弧的末端正好停在当前那个阶段上。**换成逆时针或者从三点起，
 * 弧和节点就会对不上**，那比没有弧更糟：它会指着一个错的阶段。
 *
 * 画在 .halo 自己的轨道上（同一个 inset），不是第二个同心圆 —— §5.0.1 那条
 * 「只留一个大环」仍然管着这里。
 */
.progress {
  position: absolute; inset: 4.5%; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from 0deg,
    var(--sand-deep) 0turn, var(--sand-deep) calc(var(--progress, 0) * 1turn),
    transparent calc(var(--progress, 0) * 1turn));
  -webkit-mask: radial-gradient(transparent 68.5%, #000 69.5% 70.5%, transparent 71.5%);
  mask: radial-gradient(transparent 68.5%, #000 69.5% 70.5%, transparent 71.5%);
  opacity: .85;
  transition: --progress .6s ease;
}

/* 节点：圆。旋出去再转回来，圆始终正对。 */
.stage-node {
  position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 6;
  transform: rotate(var(--a)) translateY(calc(-1 * var(--r))) rotate(calc(-1 * var(--a)));
}
.stage-node button {
  position: absolute; left: -28px; top: -28px;
  width: 56px; height: 56px; padding: 0; display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,.28); border-radius: 50%;
  background: rgba(42,39,50,.36); backdrop-filter: blur(16px);
  cursor: pointer; font: inherit;
  transition: transform .28s cubic-bezier(.2,.8,.2,1),
              background .28s, border-color .28s, box-shadow .28s;
}
.stage-node button i {
  width: 9px; height: 9px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.44); background: #575264;
  transition: background .28s, border-color .28s, box-shadow .28s;
}
/* 标签在圆外面，且不跟着放大 —— 否则会挤到邻居。 */
.stage-node button span {
  position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
  font: 700 12px/1 ui-sans-serif, sans-serif; letter-spacing: .04em; white-space: nowrap;
  color: rgba(255,255,255,.66); transition: color .28s;
}
.stage-node button em {
  position: absolute; top: 82px; left: 50%; transform: translate(-50%, 3px);
  font: 500 10px/1 ui-sans-serif, sans-serif; font-style: normal; white-space: nowrap;
  color: rgba(255,255,255,.44); opacity: 0; transition: .24s;
}
.stage-node button:hover, .stage-node button:focus-visible {
  transform: scale(1.28); z-index: 12; outline: none;
  border-color: rgba(255,255,255,.55);
  background: linear-gradient(145deg, rgba(172,122,112,.58), rgba(81,83,111,.52));
  box-shadow: 0 16px 44px rgba(35,27,40,.36);
}
.stage-node button:hover span, .stage-node button:focus-visible span { color: #fff; }
.stage-node button:hover em, .stage-node button:focus-visible em {
  opacity: 1; transform: translate(-50%, 0);
}

.stage-node.bound button { border-color: rgba(197,173,135,.46); }
.stage-node.bound button i { background: #c5ad87; border-color: #c5ad87; }
.stage-node.current button {
  border-color: rgba(225,198,160,.75); box-shadow: 0 0 0 5px rgba(212,178,139,.08);
}
.stage-node.live button {
  border-color: rgba(225,198,160,.85);
  background: linear-gradient(145deg, rgba(169,113,103,.44), rgba(84,79,101,.4));
  animation: ringBreathe 2.8s ease-in-out infinite;
}
.stage-node.live button i {
  background: var(--sand-strong); border-color: var(--sand-strong);
  box-shadow: 0 0 16px rgba(228,207,173,.75);
}
.stage-node.live button span { color: rgba(255,255,255,.9); }

/*
 * pass / fail。**排在 .bound / .live 之后是故意的** —— 一个阶段可以同时有线程、
 * 有进程、又已经被人批准过，颜色以裁决为准，那是这三样里唯一说明"这个阶段行不行"
 * 的信息。
 *
 * 判据在服务端（panel-server.ts 的 markOf）：绿 = 账本里有人 approve 过这个阶段，
 * 不是"这轮没报问题"。别在这里凭 gap 数量另算一套。
 *
 * 形状是颜色之外的第二信号，不是装饰：已批准画对勾，有问题画空心圈，没动过还是
 * 实心点。设计稿 §3 要求"不依赖颜色作为唯一状态表达"，删掉形状就违反它。
 */
.stage-node.approved button {
  border-color: color-mix(in oklch, var(--approved) 52%, transparent);
}
.stage-node.approved button i {
  width: 13px; height: 7px; border-radius: 0; background: transparent;
  border: 0; border-left: 2px solid var(--approved); border-bottom: 2px solid var(--approved);
  box-shadow: none; transform: rotate(-45deg) translate(1px, -2px);
}
.stage-node.approved button span { color: rgba(255,255,255,.74); }

.stage-node.problem button {
  border-width: 2px;
  border-color: color-mix(in oklch, var(--problem) 62%, transparent);
}
.stage-node.problem button i {
  width: 12px; height: 12px; background: transparent;
  border: 2px solid var(--problem); box-shadow: none;
}
.stage-node.problem button span { color: rgba(255,255,255,.82); }

@keyframes ringBreathe {
  0%, 100% { box-shadow: 0 0 0 4px rgba(212,178,139,.10), 0 0 20px rgba(228,207,173,.24); }
  50%      { box-shadow: 0 0 0 12px rgba(212,178,139,.05), 0 0 40px rgba(228,207,173,.48); }
}

/* 中心信息锚点 */
.center {
  position: absolute; inset: 27%; z-index: 4;
  border: 1px solid rgba(255,255,255,.22); border-radius: 50%;
  background: rgba(39,36,47,.3); backdrop-filter: blur(22px) saturate(115%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 9%;
  box-shadow: 0 22px 64px rgba(31,24,37,.22);
  animation: centerFloat 6s ease-in-out infinite;
}
@keyframes centerFloat { 50% { transform: translateY(-5px); } }
.center small {
  font: 850 9px/1 ui-sans-serif, sans-serif; letter-spacing: .13em;
  text-transform: uppercase; color: var(--sand); white-space: nowrap;
}
.center h3 { margin: 10px 0 7px; font: 560 clamp(26px, 3.4vh, 40px)/1 var(--serif); letter-spacing: -.04em; }
.center p { margin: 0; color: rgba(255,255,255,.6); font-size: 12px; line-height: 1.7; }
.center b { display: block; margin-top: 12px; color: var(--sand-deep); font: 500 38px/1 Georgia, serif; }
.center b em {
  display: block; margin-top: 6px; font: 700 9px/1 ui-sans-serif, sans-serif;
  font-style: normal; letter-spacing: .16em; color: rgba(255,255,255,.44);
}

/*
 * ── 阶段弹窗 ──────────────────────────────────────────────
 *
 * 点环上的小圈打开，显示这个阶段现在的问题（用户 2026-07-29 第 3 条）。它和左侧
 * 常驻面板是两层：**悬停看概要，点击看明细**。
 *
 * 用原生 <dialog showModal> 而不是自己拿 div 搭：Esc 关闭、焦点收拢、以及 top
 * layer —— 最后一条要紧，因为 .columns 上有 transition 和 overflow:hidden，自搭
 * 的浮层会被裁掉或者压在环下面。交接 §5.0.2 明确写着"弹窗会盖住环，所以它必须能
 * 干脆地关掉"，Esc 是最干脆的那条，白拿。
 *
 * **这里没有 approve / reject 按钮，而且不许有。** 裁决只发生在 Codex 自己的
 * elicitation 选择器里（PRD §1、§5.2b）。弹窗的主动作是"把这个裁决交给 Codex
 * 问我"—— 它组题、把问题送进那个阶段的终端，然后等你在 Codex 里选。面板显示闸门
 * 说了什么，永远不提供改变它的控件。
 */
/*
 * flex 列是**必须的**，不是排版偏好：`.sheet-body` 的 `overflow-y: auto` 只有在
 * 高度被约束住时才会滚。不给它约束，内容长了就整体撑破 max-height，然后被
 * `overflow: hidden` 从底下裁掉 —— 先没的正是底部那排动作按钮。
 */
.sheet {
  display: flex; flex-direction: column;
  width: min(560px, calc(100vw - 48px)); max-height: min(78vh, 720px);
  margin: auto; padding: 0; border: 1px solid rgba(255,255,255,.19); border-radius: 20px;
  background: oklch(0.185 0.036 295 / 94%); backdrop-filter: blur(26px) saturate(115%);
  color: var(--foreground); box-shadow: 0 40px 120px rgba(14,10,22,.6);
  overflow: hidden;
}
.sheet:not([open]) { display: none; }
.sheet::backdrop { background: oklch(0.09 0.03 290 / 60%); backdrop-filter: blur(2px); }

.sheet-head {
  flex: 0 0 auto;
  display: flex; align-items: flex-start; gap: 16px;
  padding: 22px 22px 16px 26px; border-bottom: 1px solid rgba(255,255,255,.1);
}
.sheet-head > div { flex: 1; min-width: 0; }
.sheet-head small {
  font: 850 9px/1 ui-sans-serif, sans-serif; letter-spacing: .2em;
  text-transform: uppercase; color: oklch(0.79 0.085 73 / 88%);
}
.sheet-head h2 {
  margin: 11px 0 0; font: 560 27px/1.1 var(--serif); letter-spacing: -.04em;
}
.sheet-head .mark-pill { margin-top: 12px; }
.sheet-close {
  flex: 0 0 auto; width: 32px; height: 32px; padding: 0; display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,.16); border-radius: 50%;
  background: transparent; color: rgba(255,255,255,.6); cursor: pointer;
  font: 500 14px/1 ui-sans-serif, sans-serif; transition: background .2s, color .2s;
}
.sheet-close:hover { background: rgba(255,255,255,.1); color: #fff; }

.sheet-tabs {
  flex: 0 0 auto;
  display: flex; gap: 4px; padding: 0 22px; border-bottom: 1px solid rgba(255,255,255,.1);
}
.sheet-tab {
  padding: 11px 14px 10px; border: 0; border-bottom: 2px solid transparent;
  background: transparent; color: rgba(255,255,255,.46); cursor: pointer;
  font: 750 10px/1 ui-sans-serif, sans-serif; letter-spacing: .14em; text-transform: uppercase;
  transition: color .2s, border-color .2s;
}
.sheet-tab:hover { color: rgba(255,255,255,.78); }
.sheet-tab[aria-selected="true"] { color: var(--sand-strong); border-bottom-color: var(--sand-deep); }

.sheet-body { flex: 1 1 auto; min-height: 0; padding: 6px 26px 18px; overflow-y: auto; }

/*
 * ── 标准编辑器 ────────────────────────────────────────────
 *
 * **网页上唯一可以改的东西**（PRD §1.1）。它改的是「标准」——「这条我们本来就不该
 * 要求」；而 approve 说的是「这份产物够好了」。前者不需要人说谎就能撤销一个阻断项，
 * 后者必须在人被正面问到时回答。
 *
 * 所以这里可以有输入框和保存按钮，而**永远不许有 approve / reject / 接受风险**。
 */
.rubric-roles { display: flex; gap: 6px; margin: 16px 0 4px; }
.rubric-role {
  padding: 6px 12px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px;
  background: transparent; color: rgba(255,255,255,.55); cursor: pointer;
  font: 700 10px/1 ui-sans-serif, sans-serif; letter-spacing: .1em;
  transition: background .2s, color .2s, border-color .2s;
}
.rubric-role:hover { color: #fff; }
.rubric-role[aria-pressed="true"] {
  border-color: rgba(225,198,160,.5); background: rgba(169,113,103,.18); color: #fff;
}
.rubric-scope {
  margin: 10px 0 0; font: 400 11px/1.6 var(--serif); color: rgba(255,255,255,.42);
}
.criterion {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 0; border-top: 1px solid rgba(255,255,255,.085);
}
.criterion textarea {
  flex: 1; min-width: 0; min-height: 42px; resize: vertical;
  padding: 8px 10px; border: 1px solid rgba(255,255,255,.14); border-radius: 9px;
  background: rgba(255,255,255,.04); color: var(--foreground);
  font: 400 12.5px/1.55 var(--serif);
}
.criterion textarea:focus { outline: none; border-color: rgba(225,198,160,.5); }
/* 「阻不阻断」是这里唯一真正改变闸门的开关，所以它要看得见，不是一个小方块。 */
.criterion-block {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; margin-top: 9px;
  font: 600 10px/1 ui-sans-serif, sans-serif; letter-spacing: .08em;
  color: rgba(255,255,255,.5); cursor: pointer; white-space: nowrap;
}
.criterion-block input { accent-color: var(--problem); }
.criterion-block.on { color: var(--problem); }
.criterion-drop {
  flex: 0 0 auto; margin-top: 6px; width: 28px; height: 28px; padding: 0;
  border: 1px solid rgba(255,255,255,.14); border-radius: 8px;
  background: transparent; color: rgba(255,255,255,.45); cursor: pointer;
  font: 500 13px/1 ui-sans-serif, sans-serif;
}
.criterion-drop:hover { color: #fff; background: rgba(255,255,255,.08); }

.rubric-add {
  margin-top: 12px; padding: 8px 14px; border-radius: 9px; cursor: pointer;
  border: 1px dashed rgba(255,255,255,.24); background: transparent;
  color: rgba(255,255,255,.6); font: 600 11px/1 ui-sans-serif, sans-serif;
}
.rubric-add:hover { color: #fff; border-color: rgba(255,255,255,.4); }

/*
 * 理由框。**只在这次编辑会退休掉活着的阻断项时才出现。**
 *
 * 一直摆着会训练人无视它；只在真的要撤下一条标准时冒出来，它才是一次提问。
 */
.rubric-reason { margin-top: 16px; }
.rubric-reason[hidden] { display: none; }
.rubric-reason p {
  margin: 0 0 8px; font: 400 12px/1.6 var(--serif); color: var(--problem);
}
.rubric-reason input {
  width: 100%; padding: 9px 11px; border-radius: 9px;
  border: 1px solid color-mix(in oklch, var(--problem) 44%, transparent);
  background: rgba(255,255,255,.04); color: var(--foreground);
  font: 400 12.5px/1.5 var(--serif);
}
.rubric-reason input:focus { outline: none; border-color: var(--problem); }
.rubric-note { margin-top: 12px; font: 400 11.5px/1.6 var(--serif); color: rgba(255,255,255,.5); }
.rubric-note.bad { color: var(--problem); }
.sheet-line { margin: 16px 0 0; color: rgba(255,255,255,.6); font-size: 12.5px; line-height: 1.75; }
.sheet-empty { margin: 18px 0 4px; font: 400 12px/1.7 var(--serif); color: rgba(255,255,255,.46); }

.sheet-section {
  margin: 20px 0 8px;
  font: 700 9px/1 ui-sans-serif, sans-serif; letter-spacing: .16em;
  text-transform: uppercase; color: rgba(255,255,255,.38);
}
.gap {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 0; border-top: 1px solid rgba(255,255,255,.085);
}
.gap-sev {
  flex: 0 0 auto; margin-top: 1px; padding: 3px 7px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05);
  font: 800 9px/1.2 ui-monospace, monospace; letter-spacing: .06em; color: var(--sand);
}
.gap.open .gap-sev { color: var(--problem); border-color: color-mix(in oklch, var(--problem) 40%, transparent); }
.gap-text { flex: 1; min-width: 0; }
.gap-text strong { display: block; font: 500 13.5px/1.45 var(--serif); letter-spacing: -.01em; }
.gap-text span {
  display: block; margin-top: 5px;
  font: 500 10px/1.4 ui-monospace, monospace; letter-spacing: .05em; color: rgba(255,255,255,.4);
}
/* 结案理由要看得见 —— "修好了"和"这轮忘了提"的区别全在这一行上。 */
.gap-text em {
  display: block; margin-top: 6px; font-style: normal;
  font: 400 11.5px/1.6 var(--serif); color: rgba(255,255,255,.56);
}

.sheet-foot {
  flex: 0 0 auto;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 15px 22px 18px 26px; border-top: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.022);
}
.enter, .run, .ask {
  min-height: 38px; padding: 0 17px; border-radius: 10px; cursor: pointer;
  font: 820 10px/1 ui-sans-serif, sans-serif; letter-spacing: .12em; text-transform: uppercase;
  transition: filter .2s, opacity .2s, background .2s;
}
/* 主动作只有一个 */
.ask {
  margin-left: auto; border: 0; color: #302d38;
  background: linear-gradient(115deg, #ddc8a7, #c49a81, #a97879);
}
.ask:hover { filter: brightness(1.08); }
.enter, .run {
  border: 1px solid rgba(255,255,255,.27); color: #f5eee6; background: rgba(255,255,255,.06);
}
.enter:hover, .run:hover { background: rgba(255,255,255,.12); }
.enter[disabled], .run[disabled], .ask[disabled] { opacity: .38; cursor: default; filter: none; }
.enter[hidden], .run[hidden], .ask[hidden] { display: none; }

.portal {
  position: absolute; left: 50%; top: 50%; width: 110px; height: 110px; border-radius: 50%;
  transform: translate(-50%,-50%) scale(.1); opacity: 0; z-index: 15; pointer-events: none;
  background: radial-gradient(circle, #e0c5a5 0, var(--rose) 36%, rgba(79,72,94,.72) 65%, transparent 68%);
}
.portal.go { animation: portal .72s cubic-bezier(.18,.75,.24,1) both; }
@keyframes portal {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(.1); }
  30% { opacity: .95; }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(14); }
}

/* ── 阶段视图（在第三列里原地替换） ───────────────────── */
#stage-view {
  display: flex; flex-direction: column; gap: 12px; padding: 22px 26px 20px;
  opacity: 0; transform: scale(.94);
  transition: opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1);
}
#stage-view.active { opacity: 1; transform: scale(1); }
.stage-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.stage-title {
  display: flex; align-items: baseline; gap: 14px;
  font: 560 30px/1 var(--serif); letter-spacing: -.04em;
  text-shadow: 0 1px 14px rgba(16,12,24,.85);
}
.stage-title .thread {
  font: 500 10px/1 ui-monospace, Menlo, monospace; letter-spacing: .1em;
  color: rgba(255,255,255,.44); text-transform: uppercase;
}
.back {
  border: 0; background: transparent; color: #e2caa7; cursor: pointer; padding: 8px 2px;
  font: 800 10px/1 ui-sans-serif, sans-serif; letter-spacing: .14em; text-transform: uppercase;
}
.back:hover { color: var(--sand-strong); }
.surface {
  flex: 1; min-height: 0;
  border: 1px solid rgba(255,255,255,.18); border-radius: 18px;
  background: oklch(0.132 0.028 295);
  box-shadow: 0 22px 80px rgba(31,24,37,.38); padding: 15px 17px;
}
#term { width: 100%; height: 100%; }
.xterm .xterm-viewport { background: transparent !important; }
.note { font: 400 11px/1.6 var(--serif); color: rgba(255,255,255,.5); }

@media (prefers-reduced-motion: reduce) {
  body::before, .halo::before, .center, .live-flag i,
  .stage-node.live button, .portal { animation: none !important; }
  #orbit-view, #stage-view, .stage-node button { transition: none !important; }
}
</style>
</head>
<body>
<header class="topbar">
  <span class="wordmark">stagepass</span>
  <span class="crumb"><b id="crumb-change">—</b></span>
  <span class="live-flag"><i></i>LOCAL SYNCED</span>
</header>

<div class="columns" id="columns">
  <button class="expand" id="expand">☰ 展开工作区</button>
  <section class="col workspace">
    <div class="col-head"><small>Workspace</small><h2>Projects</h2>
      <button class="new" id="new-project" type="button" title="新建 Project">+</button>
      <span class="count" id="project-count">01</span></div>
    <div class="rows" id="projects"></div>
  </section>

  <section class="col workspace">
    <div class="col-head"><small>Workspace</small><h2>Changes</h2>
      <button class="new" id="new-change" type="button" title="新建 Change">+</button>
      <span class="count" id="change-count">00</span></div>
    <div class="rows" id="changes"></div>
  </section>

  <section class="col stage">
    <section class="view" id="orbit-view">
      <!--
        左 40%：常驻的阶段状态面板。默认显示 Change 概览；鼠标移到环上任一阶段，
        这里刷成那个阶段；离开就回到默认。明细在弹窗里，不在这。
      -->
      <aside class="status-panel" id="status-panel">
        <small class="status-kicker" id="status-kicker">Change Gate Orbit</small>
        <h1 class="status-title" id="status-title">—</h1>
        <span class="mark-pill" id="status-mark" hidden></span>
        <p class="status-line" id="status-line"></p>
        <dl class="status-facts" id="status-facts"></dl>
        <p class="status-foot" id="status-foot"></p>
      </aside>

      <!-- 右 60%：只有环。往这里加东西之前，先读文件头那四条。 -->
      <div class="orbit-stage">
        <div class="orbit-wrap" id="orbit-wrap">
          <div class="halo"></div>
          <div class="progress" id="progress"></div>
          <div class="center">
            <small id="center-kicker">Stage Orbit</small>
            <h3 id="center-title">—</h3>
            <p id="center-line">十一个阶段，每个阶段一个 Codex 线程。</p>
            <b id="center-count">0<em>Approved</em></b>
          </div>
          <div class="portal" id="portal"></div>
        </div>
      </div>
    </section>

    <!--
      点小环打开。显示这个阶段的全部问题 + 闸门说了什么。
      底下三个按钮：进终端 / 跑这个阶段 / 请 Codex 问我。
      **没有 approve / reject，也不许加**（PRD §1）。
    -->
    <dialog class="sheet" id="sheet">
      <div class="sheet-head">
        <div>
          <small id="sheet-kicker">Stage</small>
          <h2 id="sheet-title">—</h2>
          <span class="mark-pill" id="sheet-mark"></span>
        </div>
        <button class="sheet-close" id="sheet-close" type="button" aria-label="关闭">✕</button>
      </div>
      <!--
        两个页签，不是把两块内容摞起来。改标准是一件要专门去做的事（它改变什么
        能挡闸门），摞在问题下面会让人一边看问题一边顺手改标准 —— 那正是最不该
        顺手的一件事。
      -->
      <div class="sheet-tabs" role="tablist">
        <button class="sheet-tab" id="tab-gaps" type="button" role="tab" aria-selected="true">问题</button>
        <button class="sheet-tab" id="tab-rubric" type="button" role="tab" aria-selected="false">标准</button>
      </div>
      <div class="sheet-body">
        <p class="sheet-line" id="sheet-line"></p>
        <div id="sheet-gaps"></div>
        <div id="sheet-rubric" hidden></div>
      </div>
      <div class="sheet-foot">
        <button class="enter" id="enter" type="button">进入终端</button>
        <button class="run" id="run" type="button" hidden>跑这个阶段</button>
        <button class="run" id="waive" type="button" hidden>接受一条风险</button>
        <button class="ask" id="ask" type="button" hidden>请 Codex 问我</button>
      </div>
    </dialog>

    <section class="view" id="stage-view" hidden>
      <div class="stage-head">
        <div class="stage-title">
          <span id="stage-name">—</span>
          <span class="thread" id="stage-thread"></span>
        </div>
        <button class="back" id="back">← 返回阶段环</button>
      </div>
      <div class="surface"><div id="term"></div></div>
      <p class="note" id="stage-note">画面由 Codex 自己绘制。这里不做任何裁决：选择仍然发生在 Codex 的选择器里。</p>
    </section>
  </section>
</div>

<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script src="/panel.js"></script>
</body>
</html>
