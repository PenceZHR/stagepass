<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>StagePass · 终端面板</title>
<link rel="stylesheet" href="/xterm.css">
<style>
  :root { color-scheme: dark; --bg:#0b0d10; --panel:#14181d; --line:#232a32; --dim:#8a95a3; --on:#4ec9b0; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
         background:var(--bg); color:#d5dbe3;
         font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { display:flex; align-items:center; gap:12px; padding:8px 14px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  header b { font-weight:600; letter-spacing:.02em; }
  header .note { color:var(--dim); font-size:12px; }
  nav { display:flex; gap:4px; padding:8px 10px; overflow-x:auto;
        border-bottom:1px solid var(--line); background:var(--panel); }
  nav button { flex:0 0 auto; padding:5px 11px; border:1px solid var(--line);
               border-radius:5px; background:transparent; color:var(--dim);
               font:inherit; cursor:pointer; }
  nav button:hover { color:#d5dbe3; }
  nav button[aria-selected="true"] { background:#1d232b; color:#fff; border-color:#33404e; }
  nav button .dot { display:inline-block; width:6px; height:6px; margin-left:7px;
                    border-radius:50%; background:#3a444f; vertical-align:middle; }
  nav button.live .dot { background:var(--on); }
  main { flex:1; min-height:0; padding:8px; }
  #term { width:100%; height:100%; }
  .empty { display:grid; place-items:center; height:100%; color:var(--dim); }
</style>
</head>
<body>
<header>
  <b>StagePass</b>
  <span class="note">终端面板 —— Codex 在里面自己画。这里不做任何裁决：选择仍然发生在 Codex 的选择器里。</span>
</header>
<nav id="tabs"></nav>
<main><div id="term"></div></main>
<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script src="/panel.js"></script>
</body>
</html>
