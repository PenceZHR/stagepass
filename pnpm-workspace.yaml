allowBuilds:
  '@anthropic-ai/claude-code': true
  better-sqlite3: true
  esbuild: true
  # false on purpose: node-pty ships prebuilds for this platform, so there is
  # nothing to compile (PRD §10 -- the "it needs a toolchain" worry was measured
  # away). package.json's postinstall restores the exec bit the prebuilt
  # spawn-helper is missing; without it you get a posix_spawnp failure that does
  # not name the file.
  node-pty: false
  sharp: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
